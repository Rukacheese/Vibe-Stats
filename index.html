<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f14">
  <title>Guild Tracker</title>
  <meta name="description" content="Rankings, statistics and member comparison for our guild.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/rankings" id="brand">Guild Tracker</a>
      <nav class="tabs" id="nav" aria-label="Main">
        <a href="#/rankings" data-route="rankings">Rankings</a>
        <a href="#/charts" data-route="charts">Charts</a>
        <a href="#/compare" data-route="compare">Compare</a>
        <a href="#/data" data-route="data">Data</a>
      </nav>
      <label class="week" for="weekSel">
        <span>Week of</span>
        <select id="weekSel" aria-label="Select week"></select>
      </label>
    </div>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <footer class="foot">
    <p id="foot-note">Demo data included. Replace <code>data/stats.csv</code> with your own guild stats.</p>
  </footer>

  <script src="vendor/chart.umd.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
